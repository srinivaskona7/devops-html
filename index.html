<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps HTML Interactive Portal</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 {
      color: var(--text-bright);
      font-size: 1.8rem;
      margin-bottom: 0.75rem;
    }
    p {
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: var(--text);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      margin-bottom: 1.5rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #ffffff;
      background: #238636;
      border: 1px solid rgba(240, 246, 252, 0.1);
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .btn-secondary {
      background: #21262d;
      color: var(--text-bright);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: #30363d; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Live Production</span>
    <h1>DevOps HTML Studio & Portal</h1>
    <p>Interactive DevOps HTML architecture diagrams, visual training blueprints, and modular lesson templates.</p>
    <div class="links">
      <a class="btn" href="https://github.com/srinivaskona7/devops-html" target="_blank" rel="noopener">GitHub Repository</a>
    </div>
  </div>
</body>
</html>
