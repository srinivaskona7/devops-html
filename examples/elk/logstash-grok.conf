input { file { path => "/path/to/examples/elk/sample-access.log" start_position => "beginning" sincedb_path => "/dev/null" mode => "read" exit_after_read => true file_completed_action => "log" file_completed_log_path => "/path/to/examples/elk/done.log" } }
filter {
  grok { match => { "message" => '%{IPORHOST:client_ip} %{USER:ident} %{USER:auth} \[%{HTTPDATE:ts}\] "%{WORD:verb} %{URIPATHPARAM:path} HTTP/%{NUMBER:http_version}" %{NUMBER:status:int} %{NUMBER:bytes:int} "%{DATA:referrer}" "%{DATA:agent}" %{NUMBER:took:float}' } }
  if "_grokparsefailure" not in [tags] {
    date { match => ["ts", "dd/MMM/yyyy:HH:mm:ss Z"] target => "@timestamp" }
    mutate { remove_field => ["ts","message","ident","auth","event","host","log","@version"] lowercase => ["verb"] }
    if [status] >= 500 { mutate { add_tag => ["server_error"] } }
  }
}
output { stdout { codec => json_lines } }
