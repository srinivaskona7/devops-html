input { file { path => "/path/to/examples/elk/sample-app.json" start_position => "beginning" sincedb_path => "/dev/null" mode => "read" exit_after_read => true file_completed_action => "log" file_completed_log_path => "/path/to/examples/elk/done2.log" codec => json } }
filter {
  mutate { rename => { "msg" => "message" } remove_field => ["event","host","log","@version"] }
  if [level] == "ERROR" { mutate { add_tag => ["needs_attention"] } }
}
output { stdout { codec => json_lines } }
