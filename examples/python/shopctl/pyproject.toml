[project]
name = "shopctl"
version = "0.1.0"
description = "Small ops CLI: health checks, S3 backups, config rendering"
requires-python = ">=3.12"
dependencies = ["typer>=0.15", "httpx>=0.28", "pydantic>=2.10", "pyyaml>=6", "jinja2>=3.1", "tenacity>=9", "boto3>=1.35", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "moto[s3]>=5", "types-PyYAML", "types-boto3[s3]"]

[project.scripts]
shopctl = "shopctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopctl"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
addopts = "-q --cov=shopctl --cov-report=term-missing"
testpaths = ["tests"]
